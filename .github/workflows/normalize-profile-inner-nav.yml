name: Normalize profile inner nav

on:
  push:
    paths:
      - '.github/workflows/normalize-profile-inner-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace profile inner nav styles in source CSS
        shell: python
        run: |
          from pathlib import Path
          path = Path('css/mobile-market.css')
          text = path.read_text(encoding='utf-8')
          old = '''.m-profile-inner-nav{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
  margin:10px 0 14px;
}
.m-profile-inner-nav a{
  min-height:76px;
  padding:9px 5px;
  border:1px solid #e4e8ee;
  border-radius:17px;
  background:#f7f9fb;
  color:#111827;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
}
.m-profile-inner-nav a.active{
  background:#22e52d;
  border-color:#22e52d;
  color:#071307;
}
.m-profile-inner-nav span{
  width:29px;
  height:29px;
  border-radius:10px;
  background:#fff;
  display:grid;
  place-items:center;
}
.m-profile-inner-nav span img{width:18px;height:18px}
.m-profile-inner-nav b{font-size:10px;line-height:1.05}
'''
          new = '''.m-profile-inner-nav{
  position:relative;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;
  margin:10px 0 14px;
  padding:6px;
  border:1px solid rgba(255,255,255,.46);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.10));
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  backdrop-filter:blur(28px) saturate(190%);
  box-shadow:0 14px 38px rgba(15,23,42,.16),inset 0 1px 0 rgba(255,255,255,.70),inset 0 -1px 0 rgba(255,255,255,.18);
  overflow:hidden;
}
.m-profile-inner-nav::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.30),transparent 34%,rgba(255,255,255,.10) 68%,transparent);
  pointer-events:none;
}
.m-profile-inner-nav a{
  position:relative;
  z-index:1;
  min-height:64px;
  padding:8px 4px;
  border:1px solid transparent;
  border-radius:22px;
  background:transparent;
  color:#3f4856;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  text-align:center;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}
.m-profile-inner-nav a.active{
  border-color:rgba(255,255,255,.52);
  background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(40,225,26,.18));
  color:#075d10;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 8px 20px rgba(15,23,42,.10);
}
.m-profile-inner-nav span{
  width:29px;
  height:29px;
  border-radius:10px;
  background:transparent;
  display:grid;
  place-items:center;
}
.m-profile-inner-nav span img{width:18px;height:18px}
.m-profile-inner-nav b{font-size:10px;line-height:1.05}
'''
          if old not in text:
              raise SystemExit('Expected profile inner nav block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit source CSS change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mobile-market.css
          git commit -m "Match profile subsections with mobile nav style"
          git push

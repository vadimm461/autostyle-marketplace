<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор премии</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#f4f7fb;padding:20px;color:#111827}
h1{font-size:34px;font-weight:900;margin-bottom:20px}

.form{
  background:#fff;padding:20px;border-radius:24px;
  display:grid;grid-template-columns:minmax(280px,2fr) repeat(3,1fr) auto;
  gap:12px;margin-bottom:24px;box-shadow:0 10px 25px rgba(0,0,0,.05)
}
.catalog-picker{position:relative}
.catalog-search,input,select{
  width:100%;padding:14px;border-radius:14px;border:1px solid #dbe2ea;
  font-size:14px;outline:none;background:#fff
}
input:focus,select:focus,.catalog-search:focus{
  border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.1)
}
input[readonly]{background:#f8fafc;color:#475569}
.catalog-results{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);
  max-height:360px;overflow:auto;background:#fff;border:1px solid #dbe2ea;
  border-radius:16px;box-shadow:0 18px 45px rgba(15,23,42,.16);z-index:50
}
.catalog-results.open{display:block}
.catalog-item{
  width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;
  align-items:center;padding:10px 12px;border:0;border-bottom:1px solid #eef2f7;
  background:#fff;text-align:left;cursor:pointer
}
.catalog-item:last-child{border-bottom:0}
.catalog-item:hover{background:#f0fdf4}
.catalog-item img{
  width:52px;height:52px;object-fit:contain;border-radius:10px;background:#f8fafc
}
.catalog-item-name{font-weight:800;line-height:1.25}
.catalog-item-meta{font-size:12px;color:#64748b;margin-top:4px}
.catalog-item-price{font-weight:900;white-space:nowrap}
.catalog-empty{padding:18px;color:#64748b;text-align:center}
.selected-product{
  display:none;margin-top:10px;padding:10px 12px;border-radius:14px;
  background:#f0fdf4;border:1px solid #bbf7d0;font-size:13px
}
.selected-product.show{display:block}
button{
  border:none;padding:14px;border-radius:14px;font-weight:800;cursor:pointer;transition:.2s
}
button:hover{transform:translateY(-1px)}
.add{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;min-width:170px}
.status{
  grid-column:1/-1;display:none;padding:12px 14px;border-radius:14px;font-weight:700
}
.status.show{display:block}
.status.ok{background:#ecfdf5;color:#047857}
.status.error{background:#fef2f2;color:#b91c1c}

.group-block{margin-bottom:26px}
.group-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  padding:18px 22px;background:#fff;border-radius:24px;
  box-shadow:0 10px 25px rgba(0,0,0,.05)
}
.group-title{font-size:28px;font-weight:900}
.group-count{font-size:14px;color:#64748b}
.card{
  background:#fff;padding:22px;border-radius:24px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 10px 25px rgba(0,0,0,.05);border:1px solid #eef2f7
}
.card-left{display:flex;flex-direction:column;gap:8px}
.product-name{font-size:22px;font-weight:900}
.product-code{
  display:inline-block;padding:8px 14px;background:linear-gradient(135deg,#eff6ff,#dbeafe);
  color:#1d4ed8;border-radius:14px;font-size:13px;font-weight:800;width:max-content
}
.product-info{font-size:15px;color:#475569;line-height:1.5}
.actions{display:flex;gap:10px}
.edit{background:#3b82f6;color:#fff}
.delete{background:#ef4444;color:#fff}

@media(max-width:1100px){
  .form{grid-template-columns:repeat(2,1fr)}
  .catalog-picker{grid-column:1/-1}
}
@media(max-width:700px){
  .form{grid-template-columns:1fr}
  .catalog-picker{grid-column:auto}
  .card{flex-direction:column;align-items:flex-start;gap:18px}
  .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .group-title{font-size:24px}
  .catalog-item{grid-template-columns:46px 1fr}
  .catalog-item-price{grid-column:2}
}
</style>

<script type="module" src="access-guard.js"></script>
</head>
<body>

<h1>Редактор премии</h1>

<div class="form">
  <div class="catalog-picker">
    <input id="catalogSearch" class="catalog-search" type="text"
           placeholder="Найти товар из каталога по названию или коду" autocomplete="off">
    <div id="catalogResults" class="catalog-results"></div>
    <div id="selectedProduct" class="selected-product"></div>
  </div>

  <input type="number" id="plan" min="0" placeholder="План">
  <input type="number" id="sold" min="0" placeholder="Продано">
  <input type="number" id="bonus" min="0" step="0.01" placeholder="Бонус, ₽">

  <button class="add" id="saveButton" type="button">Сохранить</button>
  <div id="status" class="status"></div>
</div>

<div id="list"></div>

<script type="module">
import { initializeApp, getApps, getApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc,
  query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { firebaseConfig } from "./firebase-config.js";

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

const CATALOG_COLLECTION = "autostyle_products";
const PREMIUM_COLLECTION = "products";

const searchInput = document.getElementById("catalogSearch");
const resultsEl = document.getElementById("catalogResults");
const selectedEl = document.getElementById("selectedProduct");
const saveButton = document.getElementById("saveButton");
const statusEl = document.getElementById("status");

let catalogProducts = [];
let selectedCatalogProduct = null;
let editId = null;

function text(value) {
  return String(value ?? "").trim();
}

function numberValue(id) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? value : 0;
}

function productCode(product) {
  return text(product.code || product.productCode || product.article || product.sku);
}

function productName(product) {
  return text(product.name || product.title || product.productName || "Без названия");
}

function productGroup(product) {
  return text(product.group || product.parent || product.category || "Без группы");
}

function productImage(product) {
  return text(product.image || product.imageURL || product.photo || product.imageUrl);
}

function productPrice(product) {
  const value = Number(product.price || 0);
  return Number.isFinite(value) ? value : 0;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showStatus(message, type = "ok") {
  statusEl.textContent = message;
  statusEl.className = `status show ${type}`;
  clearTimeout(showStatus.timer);
  showStatus.timer = setTimeout(() => {
    statusEl.className = "status";
  }, 4000);
}

async function loadCatalog() {
  resultsEl.innerHTML = '<div class="catalog-empty">Загрузка каталога…</div>';
  try {
    const snapshot = await getDocs(collection(db, CATALOG_COLLECTION));
    catalogProducts = snapshot.docs.map(docSnap => ({
      id: docSnap.id,
      ...docSnap.data()
    })).sort((a, b) => productName(a).localeCompare(productName(b), "ru"));

    renderCatalogResults("");
  } catch (error) {
    console.error("Catalog load error:", error);
    resultsEl.innerHTML =
      '<div class="catalog-empty">Не удалось загрузить товары из каталога.</div>';
    showStatus("Ошибка загрузки каталога товаров.", "error");
  }
}

function renderCatalogResults(filter) {
  const needle = text(filter).toLowerCase();

  const filtered = catalogProducts.filter(product => {
    const haystack = [
      productName(product),
      productCode(product),
      productGroup(product)
    ].join(" ").toLowerCase();

    return !needle || haystack.includes(needle);
  }).slice(0, 100);

  if (!filtered.length) {
    resultsEl.innerHTML =
      '<div class="catalog-empty">Товары не найдены.</div>';
    return;
  }

  resultsEl.innerHTML = filtered.map(product => {
    const image = productImage(product);
    const price = productPrice(product);
    return `
      <button class="catalog-item" type="button" data-id="${escapeHtml(product.id)}">
        ${image
          ? `<img src="${escapeHtml(image)}" alt="" loading="lazy">`
          : `<div style="width:52px;height:52px;border-radius:10px;background:#f1f5f9"></div>`}
        <div>
          <div class="catalog-item-name">${escapeHtml(productName(product))}</div>
          <div class="catalog-item-meta">
            Код: ${escapeHtml(productCode(product) || "—")} ·
            ${escapeHtml(productGroup(product))}
          </div>
        </div>
        <div class="catalog-item-price">${price ? `${price.toLocaleString("ru-RU")} ₽` : ""}</div>
      </button>
    `;
  }).join("");

  resultsEl.querySelectorAll(".catalog-item").forEach(button => {
    button.addEventListener("click", () => {
      const product = catalogProducts.find(item => item.id === button.dataset.id);
      if (product) selectCatalogProduct(product);
    });
  });
}

function selectCatalogProduct(product) {
  selectedCatalogProduct = product;
  searchInput.value = `${productName(product)}${productCode(product) ? ` — ${productCode(product)}` : ""}`;
  selectedEl.innerHTML = `
    Выбран товар: <b>${escapeHtml(productName(product))}</b><br>
    Код: ${escapeHtml(productCode(product) || "—")} ·
    Группа: ${escapeHtml(productGroup(product))}
  `;
  selectedEl.classList.add("show");
  resultsEl.classList.remove("open");
}

searchInput.addEventListener("focus", () => {
  renderCatalogResults(searchInput.value);
  resultsEl.classList.add("open");
});

searchInput.addEventListener("input", () => {
  selectedCatalogProduct = null;
  selectedEl.classList.remove("show");
  renderCatalogResults(searchInput.value);
  resultsEl.classList.add("open");
});

document.addEventListener("click", event => {
  if (!event.target.closest(".catalog-picker")) {
    resultsEl.classList.remove("open");
  }
});

async function loadPremiumProducts() {
  try {
    const snapshot = await getDocs(collection(db, PREMIUM_COLLECTION));
    const products = snapshot.docs.map(docSnap => ({
      id: docSnap.id,
      ...docSnap.data()
    }));
    renderPremiumProducts(products);
  } catch (error) {
    console.error("Premium products load error:", error);
    showStatus("Не удалось загрузить список премии.", "error");
  }
}

function renderPremiumProducts(products) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const grouped = new Map();
  products.forEach(product => {
    const group = text(product.group) || "Без группы";
    if (!grouped.has(group)) grouped.set(group, []);
    grouped.get(group).push(product);
  });

  if (!products.length) {
    list.innerHTML =
      '<div class="catalog-empty">Товары для премии пока не добавлены.</div>';
    return;
  }

  [...grouped.keys()].sort((a, b) => a.localeCompare(b, "ru")).forEach(group => {
    const groupProducts = grouped.get(group);
    const block = document.createElement("div");
    block.className = "group-block";
    block.innerHTML = `
      <div class="group-header">
        <div class="group-title">${escapeHtml(group)}</div>
        <div class="group-count">Товаров: ${groupProducts.length}</div>
      </div>
    `;

    groupProducts
      .sort((a, b) => text(a.name).localeCompare(text(b.name), "ru"))
      .forEach(product => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-left">
            <div class="product-name">${escapeHtml(product.name || "Без названия")}</div>
            <div class="product-code">Код: ${escapeHtml(product.code || "—")}</div>
            <div class="product-info">
              План: <b>${Number(product.plan || 0)}</b><br>
              Продано: <b>${Number(product.sold || 0)}</b><br>
              Бонус: <b>${Number(product.bonus || 0).toLocaleString("ru-RU")} ₽</b>
            </div>
          </div>
          <div class="actions">
            <button class="edit" type="button" data-edit="${escapeHtml(product.id)}">Изменить</button>
            <button class="delete" type="button" data-delete="${escapeHtml(product.id)}">Удалить</button>
          </div>
        `;
        block.appendChild(card);
      });

    list.appendChild(block);
  });

  list.querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => {
      const product = products.find(item => item.id === button.dataset.edit);
      if (product) editPremiumProduct(product);
    });
  });

  list.querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => deletePremiumProduct(button.dataset.delete));
  });
}

function editPremiumProduct(product) {
  editId = product.id;

  selectedCatalogProduct =
    catalogProducts.find(item =>
      item.id === product.sourceProductId ||
      (product.code && productCode(item) === text(product.code))
    ) || {
      id: product.sourceProductId || "",
      name: product.name,
      code: product.code,
      group: product.group,
      image: product.image || ""
    };

  selectCatalogProduct(selectedCatalogProduct);
  document.getElementById("plan").value = Number(product.plan || 0);
  document.getElementById("sold").value = Number(product.sold || 0);
  document.getElementById("bonus").value = Number(product.bonus || 0);
  saveButton.textContent = "Сохранить изменения";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deletePremiumProduct(id) {
  if (!confirm("Удалить товар из расчёта премии?")) return;

  try {
    await deleteDoc(doc(db, PREMIUM_COLLECTION, id));
    showStatus("Товар удалён из расчёта премии.");
    if (editId === id) clearForm();
    await loadPremiumProducts();
  } catch (error) {
    console.error("Delete error:", error);
    showStatus("Не удалось удалить товар.", "error");
  }
}

async function saveProduct() {
  if (!selectedCatalogProduct) {
    showStatus("Сначала выберите товар из каталога.", "error");
    searchInput.focus();
    resultsEl.classList.add("open");
    return;
  }

  const code = productCode(selectedCatalogProduct);
  const payload = {
    sourceProductId: selectedCatalogProduct.id || "",
    group: productGroup(selectedCatalogProduct),
    code,
    name: productName(selectedCatalogProduct),
    image: productImage(selectedCatalogProduct),
    price: productPrice(selectedCatalogProduct),
    plan: numberValue("plan"),
    sold: numberValue("sold"),
    bonus: numberValue("bonus"),
    updatedAt: new Date().toISOString()
  };

  saveButton.disabled = true;
  saveButton.textContent = "Сохранение…";

  try {
    if (editId) {
      await updateDoc(doc(db, PREMIUM_COLLECTION, editId), payload);
      showStatus("Изменения сохранены.");
    } else {
      let duplicate = null;

      if (payload.sourceProductId) {
        const sameProduct = await getDocs(
          query(
            collection(db, PREMIUM_COLLECTION),
            where("sourceProductId", "==", payload.sourceProductId)
          )
        );
        duplicate = sameProduct.docs[0] || null;
      }

      if (!duplicate && code) {
        const sameCode = await getDocs(
          query(collection(db, PREMIUM_COLLECTION), where("code", "==", code))
        );
        duplicate = sameCode.docs[0] || null;
      }

      if (duplicate) {
        await updateDoc(doc(db, PREMIUM_COLLECTION, duplicate.id), payload);
        showStatus("Товар уже был в премии — данные обновлены.");
      } else {
        await addDoc(collection(db, PREMIUM_COLLECTION), {
          ...payload,
          createdAt: new Date().toISOString()
        });
        showStatus("Товар добавлен в расчёт премии.");
      }
    }

    clearForm();
    await loadPremiumProducts();
  } catch (error) {
    console.error("Save error:", error);
    showStatus(`Ошибка сохранения: ${error.message || "нет доступа"}`, "error");
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "Сохранить";
  }
}

function clearForm() {
  editId = null;
  selectedCatalogProduct = null;
  searchInput.value = "";
  selectedEl.innerHTML = "";
  selectedEl.classList.remove("show");
  document.getElementById("plan").value = "";
  document.getElementById("sold").value = "";
  document.getElementById("bonus").value = "";
  saveButton.textContent = "Сохранить";
}

saveButton.addEventListener("click", saveProduct);

await Promise.all([
  loadCatalog(),
  loadPremiumProducts()
]);
</script>

<a href="../profile.html#staff-sections"
   style="position:fixed;right:16px;bottom:16px;background:#0f172a;color:white;text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:800">
  ← Профиль AutoStyle
</a>

</body>
</html>

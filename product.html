<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товар — AutoStyle</title><link rel="stylesheet" href="css/style.css"><script type="module">import{db}from'./js/firebase.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const id=new URLSearchParams(location.search).get('id');const box=document.querySelector('#product');const fmt=new Intl.NumberFormat('ru-RU');async function load(){if(!id){box.innerHTML='Товар не найден';return}const s=await getDoc(doc(db,'products',id));if(!s.exists()){box.innerHTML='Товар не найден';return}const p=s.data();box.innerHTML=`<div class="hero-grid"><img class="hero-card" src="${p.imageUrl||'assets/placeholder.svg'}"><div><span class="badge">${p.category||'AutoStyle'}</span><h1 style="font-size:54px">${p.title}</h1><div class="price">${fmt.format(Number(p.price||0))} ₽</div><p class="lead">${p.description||''}</p><div class="actions"><a class="btn primary" href="catalog.html">Назад в каталог</a><button class="btn dark">Связаться</button></div></div></div>`}load();</script></head><body><header class="nav"><div class="container navin"><a class="logo" href="index.html"><span class="mark">AS</span><span>AUTO<span class="grad">STYLE</span></span></a><nav class="menu"><a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="login.html">Вход</a></nav></div></header><main class="page"><div class="container" id="product"></div></main></body></html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Корзина — AutoStyle</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shop-pages.css">
  <link rel="stylesheet" href="css/app-mobile-shell.css">
</head>
<body>
<header class="topbar dark-topbar">
  <div class="bar">
    <a class="logo" href="index.html"><div class="logo-mark">AS</div>AUTO<span>STYLE</span></a>
    <a class="catalog-btn" href="catalog.html">☰ Каталог</a>
    <form class="search">
      <input id="siteSearch" placeholder="Я ищу автотовары...">
      <button type="button" id="siteSearchBtn">Найти</button>
    </form>
    <button id="openAuth" class="icon-btn">Аккаунт</button>
    <button class="icon-btn">♡ Избранное</button>
    <a class="icon-btn" href="cart.html">Корзина <b id="cartCount">0</b></a>
  </div>
</header>

<main class="container page-simple">
  <h1>Корзина</h1>
  <p class="muted">Проверь товары перед оформлением заказа.</p>

  <section class="cart-layout">
    <div id="cartList" class="cart-list"></div>
    <aside class="cart-summary">
      <h2>Итого</h2>
      <div class="summary-row"><span>Товары</span><b id="cartItemsCount">0</b></div>
      <div class="summary-row"><span>Сумма</span><b id="cartTotal">0 ₽</b></div>
      <button id="checkoutBtn" class="primary">Оформить заказ</button>
      <button id="clearCart" class="secondary-btn" type="button">Очистить корзину</button>
    </aside>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-group">
      <h3>AutoStyle</h3>
      <a href="contacts.html">Контакты</a>
      <a href="about.html">Про нас</a>
      <a href="contacts.html#addresses">Адреса</a>
    </div>
    <div class="footer-group">
      <h3>Выгода</h3>
      <a href="installment.html">Рассрочка</a>
      <a href="certificates.html">Подарочные сертификаты</a>
    </div>
  </div>
</footer>
<script type="module" src="js/cart.js"></script>
<script src="js/app-shell.js"></script>
</body>
</html>

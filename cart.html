<body><script src="js/page-loader.js?v=20260805-content-loader-v2"></script>
<header class="topbar dark-topbar">
<div class="bar">
<a aria-label="AutoStyle — главная" class="logo as-logo-link" href="index.html"><img alt="AutoStyle" class="as-logo-img" decoding="async" height="158" src="assets/autostyle-logo-header-clean@3x.png" srcset="assets/autostyle-logo-header-clean.png 1x, assets/autostyle-logo-header-clean@2x.png 2x, assets/autostyle-logo-header-clean@3x.png 3x" width="720"/></a>
<a class="catalog-btn" href="catalog.html">☰ Каталог</a>
<form class="search">
<input id="siteSearch" placeholder="Я ищу автотовары..."/>
<button id="siteSearchBtn" type="button">Найти</button>
</form>
<div class="as-account-wrap">
<button aria-label="Аккаунт" class="icon-btn as-head-icon-btn" id="asAccountButton" type="button">
<span aria-hidden="true" class="as-head-icon"><img alt="" src="assets/icons/user.svg"/></span><span class="as-head-label">Аккаунт</span>
</button>
<div class="as-account-popup"><div class="as-account-guest"><a class="as-account-login" href="login.html">Войти</a></div></div>
</div>
<button class="icon-btn as-head-icon-btn as-notify-btn" id="notificationsBtn" type="button"><span aria-hidden="true" class="as-head-icon"><img alt="" src="assets/icons/bell.svg"/></span><span class="as-head-label">Уведомления</span><b class="as-notify-count as-head-badge" data-count="0" id="notificationCount"></b></button><a class="icon-btn as-head-icon-btn" href="favorites.html"><span aria-hidden="true" class="as-head-icon"><img alt="" src="assets/icons/heart.svg"/></span><span class="as-head-label">Избранное</span></a>
<a class="icon-btn as-head-icon-btn" href="cart.html"><span aria-hidden="true" class="as-head-icon"><img alt="" src="assets/icons/cart.svg"/></span><span class="as-head-label">Корзина</span><b class="as-head-badge" id="cartCount">0</b></a>
</div>
</header>
<main class="container page-simple">
<h1>Корзина</h1>
<p class="muted">Проверь товары перед оформлением заказа.</p>
<section class="cart-layout">
<div class="cart-list" id="cartList"></div>
<aside class="cart-summary">
<h2>Итого</h2>
<div class="summary-row"><span>Товары</span><b id="cartItemsCount">0</b></div>
<div class="summary-row"><span>Сумма</span><b id="cartTotal">0 ₽</b></div>
<div class="payment-methods">
<h3>Способ оплаты</h3>
<label class="payment-option active">
<input checked="" name="paymentMethod" type="radio" value="cash"/>
<span class="payment-icon"><img alt="" src="assets/icons/cash.svg"></span>
<span>Наличными</span>
</label>
<label class="payment-option">
<input name="paymentMethod" type="radio" value="card"/>
<span class="payment-icon"><img alt="" src="assets/icons/card.svg"></span>
<span>Банковской картой</span>
</label>
<label class="payment-option">
<input name="paymentMethod" type="radio" value="installment"/>
<span class="payment-icon"><img alt="" src="assets/icons/percent.svg"></span>
<span>Рассрочка</span>
</label>
</div>
<details class="installment-box" hidden="" id="installmentBox" open=""><summary>Рассчитать рассрочку</summary>
<div class="installment-results" id="installmentResults">Выберите товары в корзине</div>
</details>
<div class="cart-summary-actions">
<button class="primary" id="checkoutBtn" type="button">Оформить заказ</button>
<button class="discount-card-btn" id="discountCardBtn" type="button"><img alt="" src="assets/icons/discount-card.svg">Применить скидочную карту</button>
</div>
<div class="cart-bottom-actions">
<a class="continue-shopping-btn" href="catalog.html"><img alt="" src="assets/icons/arrow-left.svg">Вернуться в каталог</a>
<a class="continue-shopping-btn" href="catalog.html"><img alt="" src="assets/icons/shopping-bag.svg">Продолжить покупки</a>
</div>
<button class="secondary-btn" id="clearCart" type="button">Очистить корзину</button>
</aside>
</section>
</main>
<div aria-hidden="true" class="quick-modal" id="quickProductModal">
<div class="quick-modal-backdrop" data-close="1"></div>
<div aria-modal="true" class="quick-modal-card" role="dialog">
<button aria-label="Закрыть" class="quick-modal-close" type="button">×</button>
<div id="quickProductContent"></div>
</div>

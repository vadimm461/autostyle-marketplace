<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoStyle</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="topbar"><div class="bar"><a class="logo" href="index.html"><div class="logo-mark">AS</div>AUTO<span>STYLE</span></a><button class="catalog-btn">☰ Каталог</button><form class="search"><input placeholder="Я ищу автотовары..."><button type="button">Найти</button></form><button id="openAuth" class="icon-btn">Войти</button><div id="accountDrop" class="dropdown" style="display:none"><button id="accountBtn" class="icon-btn">Аккаунт</button><div class="drop"><b id="userEmail"></b><p class="muted">Вы авторизованы</p><a href="admin.html">Админка</a><hr><button id="logout" class="icon-btn">Выйти</button></div></div><button class="icon-btn">Избранное</button><button class="icon-btn">Корзина <b id="cartCount">0</b></button></div></header>
<main class="container"><section class="hero-grid"><aside class="panel"><h3>Категории</h3><div id="categories" class="cat-list"></div></aside><div id="hero" class="hero"></div><aside class="side-card panel"><h2>Баннеры</h2><p class="muted">Управляются в админке.</p></aside></section><div id="banners" class="banner-row"></div><section><div class="section-head"><h2>Горячие предложения</h2><a href="catalog.html">Все товары</a></div><div id="productsGrid" class="products"></div></section></main>
<div id="authModal" class="modal"><div class="modal-card"><button id="closeAuth" style="float:right;border:0;background:#f2f4f7;border-radius:99px;width:34px;height:34px">×</button><h2>Вход в AutoStyle</h2><p class="muted">Войдите или создайте аккаунт.</p><div class="tabs"><button class="tab active" data-tab="login">Вход</button><button class="tab" data-tab="register">Регистрация</button></div><form id="loginForm"><label class="field">Email<input id="loginEmail" type="email" required></label><label class="field">Пароль<input id="loginPass" type="password" required></label><button class="primary" style="width:100%">Войти</button></form><form id="registerForm" style="display:none"><label class="field">Имя<input id="regName" required></label><label class="field">Email<input id="regEmail" type="email" required></label><label class="field">Пароль<input id="regPass" type="password" minlength="6" required></label><button class="primary" style="width:100%">Создать</button></form></div></div>
<script type="module" src="js/app.js"></script></body></html>

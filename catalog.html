<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — AutoStyle</title>

<link rel="stylesheet" href="./css/style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:999;
    background:#05070d;
    padding:18px 40px;
    display:flex;
    align-items:center;
    gap:18px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:max-content;
}

.logo-box{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#43ff1a;
    color:#000;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo h2{
    color:#fff;
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#43ff1a;
}

.catalog-btn{
    background:#43ff1a;
    color:#000;
    border:none;
    border-radius:16px;
    padding:18px 28px;
    font-weight:700;
    cursor:pointer;
}

.search{
    flex:1;
    display:flex;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
}

.search input{
    flex:1;
    border:none;
    outline:none;
    padding:18px;
    font-size:16px;
}

.search button{
    border:none;
    background:#43ff1a;
    padding:0 34px;
    font-weight:700;
    cursor:pointer;
}

.header-actions{
    display:flex;
    gap:12px;
}

.header-btn{
    background:#101522;
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    padding:16px 20px;
    border-radius:18px;
    cursor:pointer;
}

/* PAGE */

.catalog-page{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:28px;
    padding:40px;
}

.filters{
    background:#fff;
    border-radius:24px;
    padding:24px;
    height:max-content;
    box-shadow:0 10px 30px rgba(0,0,0,.04);
}

.filters h3{
    margin-bottom:24px;
    font-size:28px;
}

.filter-group{
    margin-bottom:20px;
}

.filter-group label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
}

.filter-group input,
.filter-group select{
    width:100%;
    border:1px solid #ddd;
    border-radius:14px;
    padding:14px;
    font-size:15px;
}

.price-row{
    display:flex;
    gap:10px;
}

.catalog-content{
    width:100%;
}

.catalog-top{
    background:#fff;
    border-radius:22px;
    padding:20px 24px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px;
}

.product-card{
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    padding:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
    transition:.25s;
}

.product-card:hover{
    transform:translateY(-4px);
}

.product-image{
    height:220px;
    background:#f2f3f5;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:14px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.discount{
    position:absolute;
    background:#ff4d4d;
    color:#fff;
    padding:6px 10px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    margin:12px;
}

.product-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:8px;
    min-height:56px;
}

.product-category{
    color:#777;
    margin-bottom:10px;
}

.price-row-card{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.price{
    font-size:32px;
    font-weight:800;
}

.old-price{
    color:#999;
    text-decoration:line-through;
}

.stock{
    color:#1dbb34;
    font-weight:600;
    margin-bottom:14px;
}

.cart-btn{
    width:100%;
    border:none;
    background:#05070d;
    color:#fff;
    padding:16px;
    border-radius:16px;
    font-weight:700;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:1200px){

.products-grid{
    grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:992px){

.catalog-page{
    grid-template-columns:1fr;
}

.products-grid{
    grid-template-columns:repeat(2,1fr);
}

header{
    flex-wrap:wrap;
}

}

@media(max-width:640px){

.products-grid{
    grid-template-columns:1fr;
}

.catalog-page{
    padding:20px;
}

header{
    padding:16px;
}

.search{
    width:100%;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<div class="logo-box">AS</div>
<h2>AUTO <span>STYLE</span></h2>
</div>

<button class="catalog-btn">☰ Каталог</button>

<div class="search">
<input type="text" placeholder="Я ищу автотовары...">
<button>Найти</button>
</div>

<div class="header-actions">
<button class="header-btn">Аккаунт</button>
<button class="header-btn">Избранное</button>
<button class="header-btn">Корзина</button>
</div>

</header>

<div class="catalog-page">

<aside class="filters">

<h3>Фильтры</h3>

<div class="filter-group">
<label>Поиск</label>
<input type="text" placeholder="Название, категория...">
</div>

<div class="filter-group">
<label>Категория</label>
<select>
<option>Все категории</option>
</select>
</div>

<div class="filter-group">
<label>Сортировка</label>
<select>
<option>По умолчанию</option>
<option>Цена ↑</option>
<option>Цена ↓</option>
</select>
</div>

<div class="filter-group">
<label>Цена</label>

<div class="price-row">
<input type="number" placeholder="от">
<input type="number" placeholder="до">
</div>

</div>

</aside>

<section class="catalog-content">

<div class="catalog-top">
<h2>1108 товаров</h2>
<div>Товары с нулевым остатком скрыты</div>
</div>

<div class="products-grid">

<div class="product-card">

<div class="product-image">
<div class="discount">-18%</div>
<img src="./img/product1.png">
</div>

<div class="product-title">
Пуско-зарядное устройство 70mai
</div>

<div class="product-category">
Электроника
</div>

<div class="price-row-card">
<div class="price">4 890 ₽</div>
<div class="old-price">5 990 ₽</div>
</div>

<div class="stock">
В наличии: 15 шт.
</div>

<button class="cart-btn">
🛒 В корзину
</button>

</div>

</div>

</section>

</div>

</body>
</html>

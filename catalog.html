<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Каталог — AutoStyle</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shop-pages.css">
  <link rel="stylesheet" href="css/catalog-ui-fix.css">
</head>
<body>
<header class="topbar dark-topbar">
  <div class="bar">
    <a class="logo" href="index.html"><div class="logo-mark">AS</div>AUTO<span>STYLE</span></a>
    <a class="catalog-btn" href="catalog.html">☰ Каталог</a>
    <form class="search">
      <input id="siteSearch" placeholder="Я ищу автотовары...">
      <button type="button" id="siteSearchBtn">Найти</button>
    </form>
    <button id="openAuth" class="icon-btn">Аккаунт</button>
    <button class="icon-btn">♡ Избранное</button>
    <a class="icon-btn" href="cart.html">Корзина <b id="cartCount">0</b></a>
  </div>
</header>

<main class="container catalog-page">
  <div class="catalog-title">
    <div>
      <h1>Каталог товаров</h1>
      <p class="muted">Все товары с актуальными ценами и остатками из 1С.</p>
    </div>
  </div>

  <section class="catalog-layout">
    <aside class="catalog-filters">
      <h3>Фильтры</h3>
      <label class="field">Поиск<input id="search" placeholder="Название, код..."></label>
      <label class="field">Категория<select id="category"><option value="">Все категории</option></select></label>
      <label class="field">Сортировка
        <select id="sort">
          <option value="default">По умолчанию</option>
          <option value="priceAsc">Сначала дешевле</option>
          <option value="priceDesc">Сначала дороже</option>
          <option value="nameAsc">По названию</option>
        </select>
      </label>
    </aside>

    <section>
      <div class="catalog-toolbar">
        <b id="catalogCount">0 товаров</b>
        <span class="muted">Товары с нулевым остатком скрыты</span>
      </div>
      <div id="catalogGrid" class="products"></div>
    </section>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-group">
      <h3>AutoStyle</h3>
      <a href="contacts.html">Контакты</a>
      <a href="about.html">Про нас</a>
      <a href="contacts.html#addresses">Адреса</a>
    </div>
    <div class="footer-group">
      <h3>Выгода</h3>
      <a href="installment.html">Рассрочка</a>
      <a href="certificates.html">Подарочные сертификаты</a>
    </div>
  </div>
</footer>
<script type="module" src="js/catalog.js"></script>
</body>
</html>

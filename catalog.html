<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoStyle</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="container header"><a class="brand" href="index.html"><img src="assets/logo.jpeg"><b>AUTO<span>STYLE</span></b></a><a class="catalogBtn" href="catalog.html">☰ Каталог</a><form class="search" id="searchForm"><input id="searchInput" placeholder="Я ищу автотовары..."><button>Найти</button></form><div class="navActions"><span id="userChip" class="userChip"></span><button id="authBtn" class="navBtn">Войти</button><a class="navBtn" href="admin.html">Админка</a><button class="navBtn">♡</button><button class="navBtn cart">Корзина<br><b id="cartCount">0</b></button></div></div></header><main class="container"><section class="heroGrid"><aside class="side"><h3>Категории</h3><div id="categoryList" class="catList"><div class="catItem">Категории появятся после добавления</div></div></aside><div class="hero"><button class="arrow prev" id="prev">‹</button><button class="arrow next" id="next">›</button><div id="slides"></div></div><aside class="promo"><h2>Качество, которому доверяют</h2><p>Автохимия, аксессуары, масла и товары для ухода за авто.</p><a class="primary" href="catalog.html">Смотреть каталог</a></aside></section><section id="miniBanners" class="miniBanners"></section><section><div class="sectionTitle"><h2>Горячие предложения</h2><a href="catalog.html">Все товары</a></div><div id="tabs" class="tabs"><button class="tab active">ТОП товары</button></div><div id="products" class="products"></div></section></main><div id="authModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Аккаунт AutoStyle</h2><button class="close" id="closeAuth">×</button></div><p class="muted">Войдите или создайте аккаунт. После регистрации подтвердите email.</p><div class="switch"><button id="loginTab" class="active">Вход</button><button id="registerTab">Регистрация</button></div><form id="loginForm"><label class="field">Email<input id="loginEmail" type="email" required></label><label class="field">Пароль<input id="loginPassword" type="password" required></label><button class="primary" type="submit">Войти</button></form><form id="registerForm" class="hide"><label class="field">Имя<input id="regName" required></label><label class="field">Email<input id="regEmail" type="email" required></label><label class="field">Пароль<input id="regPassword" type="password" minlength="6" required></label><button class="primary" type="submit">Создать аккаунт</button></form><p id="authMsg" class="msg"></p></div></div><script type="module" src="js/app.js"></script><script type="module" src="js/auth.js"></script></body></html>

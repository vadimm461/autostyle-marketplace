<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoStyle Marketplace</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="topbar"><div class="container header"><a class="brand" href="index.html"><img src="assets/logo.jpeg"><b>AUTO<span>STYLE</span></b></a><button class="catalogBtn">☰ Каталог</button><div class="search"><input id="searchInput" placeholder="Я ищу автотовары..."><button class="searchBtn">Найти</button></div><div class="navActions"><button class="iconBtn">♡</button><button class="iconBtn cartBtn">Корзина<br><b>0</b></button><div class="userWrap"><button id="accountBtn" class="iconBtn">Войти</button><div id="accountMenu" class="accountMenu glass"><div id="userEmail" class="userEmail"></div><a id="adminLink" href="admin.html" style="display:none">Админка</a><button id="logoutBtn">Выйти</button></div></div></div></div></header>
<main class="container"><section class="heroLayout"><aside class="sidebar glass"><div class="sideTitle">Категории</div><div id="categoryList" class="catList"></div></aside><section class="hero"><div id="heroSlides"></div><div id="heroDots" class="heroControls"></div></section><aside class="promoCol"><div class="promoCard glass"><h3>Баннеры редактируются в админке</h3><p>Добавляйте акции, фото и ссылки.</p></div><div class="promoCard glass"><h3>Shopify mini админка</h3><p>Товары, категории и баннеры под управлением.</p></div></aside></section><section id="products"><div class="sectionHead"><h2>Горячие предложения</h2><a href="catalog.html">Все товары</a></div><div id="categoryTabs" class="tabs"></div><div id="productGrid" class="grid"></div></section></main>
<div id="authModal" class="modal"><div class="modalCard"><div class="modalTop"><h2>Аккаунт AutoStyle</h2><button id="authClose" class="close">×</button></div><p class="muted">Вход и регистрация в одном окне.</p><div class="switch"><button class="authTab active" data-tab="login">Вход</button><button class="authTab" data-tab="register">Регистрация</button></div><form id="loginForm" class="form"><label class="field"><span>Email</span><input id="loginEmail" type="email" required></label><label class="field"><span>Пароль</span><input id="loginPassword" type="password" required></label><button class="primary">Войти</button></form><form id="registerForm" class="form" style="display:none"><label class="field"><span>Имя</span><input id="regName" required></label><label class="field"><span>Email</span><input id="regEmail" type="email" required></label><label class="field"><span>Пароль</span><input id="regPassword" type="password" minlength="6" required></label><button class="primary">Создать аккаунт</button></form><p id="authMsg" class="muted"></p></div></div>
<script type="module" src="js/app.js"></script></body></html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Каталог — AutoStyle</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive-lock.css">
  <link rel="stylesheet" href="css/catalog-ui-fix.css">
</head>
<body>

<header class="topbar dark-topbar">
  <div class="bar">
    <a class="logo" href="index.html">
      <div class="logo-mark">AS</div>
      AUTO<span>STYLE</span>
    </a>

    <div class="catalog-menu">
      <button class="catalog-btn" type="button">☰ Каталог</button>

      <div class="catalog-popup mega-catalog">
        <div class="mega-left">
          <h3>Каталог товаров</h3>
          <div id="catalogParents" class="mega-parent-list"></div>
        </div>

        <div class="mega-right">
          <h3 id="megaTitle">Выберите категорию</h3>
          <div id="catalogChildren" class="mega-child-grid"></div>
        </div>
      </div>
    </div>

    <form class="search">
      <input id="topSearch" placeholder="Я ищу автотовары...">
      <button id="topSearchBtn" type="button">Найти</button>
    </form>

    <button id="openAuth" class="icon-btn" type="button">Аккаунт</button>

    <div id="accountDrop" class="dropdown" style="display:none">
      <button id="accountBtn" class="icon-btn" type="button">Аккаунт</button>
      <div class="drop">
        <b id="userEmail"></b>
        <p class="muted">Вы авторизованы</p>
        <a href="admin.html">Админка</a>
        <hr>
        <button id="logout" class="icon-btn" type="button">Выйти</button>
      </div>
    </div>

    <button id="favBtn" class="icon-btn" type="button">♡ Избранное</button>
    <button id="cartBtn" class="icon-btn" type="button">Корзина <b id="cartCount">0</b></button>
  </div>
</header>

<div class="page-dim"></div>

<main class="container catalog-page">
  <section class="catalog-hero">
    <h1>Каталог товаров</h1>
  </section>

  <section class="catalog-layout">
    <aside class="catalog-filters">
      <h3>Фильтры</h3>

      <label class="filter-field">
        <span>Поиск</span>
        <input id="search" placeholder="Название, категория...">
      </label>

      <label class="filter-field">
        <span>Категория</span>
        <select id="category">
          <option value="">Все категории</option>
        </select>
      </label>

      <label class="filter-field">
        <span>Сортировка</span>
        <select id="sort">
          <option value="">По умолчанию</option>
          <option value="priceAsc">Сначала дешевле</option>
          <option value="priceDesc">Сначала дороже</option>
          <option value="nameAsc">По названию</option>
        </select>
      </label>
    </aside>

    <section class="catalog-results">
      <div class="catalog-count-row">
        <b id="catalogCount">0 товаров</b>
        <button id="zeroNotice" type="button">Товары с нулевым остатком скрыты</button>
      </div>

      <div id="catalogGrid" class="products"></div>
    </section>
  </section>
</main>

<div id="authModal" class="modal">
  <div class="modal-card">
    <button id="closeAuth" type="button" style="float:right;border:0;background:#f2f4f7;border-radius:99px;width:34px;height:34px">×</button>

    <h2>Вход в AutoStyle</h2>
    <p class="muted">Войдите или создайте аккаунт.</p>

    <div class="tabs">
      <button class="tab active" data-tab="login" type="button">Вход</button>
      <button class="tab" data-tab="register" type="button">Регистрация</button>
    </div>

    <form id="loginForm">
      <label class="field">Email<input id="loginEmail" type="email" required></label>
      <label class="field">Пароль<input id="loginPass" type="password" required></label>
      <button class="primary" style="width:100%">Войти</button>
    </form>

    <form id="registerForm" style="display:none">
      <label class="field">Имя<input id="regName" required></label>
      <label class="field">Email<input id="regEmail" type="email" required></label>
      <label class="field">Пароль<input id="regPass" type="password" minlength="6" required></label>
      <button class="primary" style="width:100%">Создать</button>
    </form>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-group">
      <h3>AutoStyle</h3>
      <a href="contacts.html">Контакты</a>
      <a href="about.html">Про нас</a>
    </div>
  </div>
</footer>

<script type="module" src="js/catalog.js"></script>
<script src="js/page-lock.js"></script>
</body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог AutoStyle</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html"><span class="logo-mark">AS</span><b>AUTO<span>STYLE</span></b></a><button class="catalog-btn">☰ Каталог</button><form class="search"><input placeholder="Поиск по каталогу"><button>Найти</button></form><button class="icon-btn" id="openAuth">👤<small>Войти</small></button><button class="cart-btn">🛒<small>Корзина</small><strong id="cartCount">0</strong></button></header><main class="wrap"><section class="section-head"><h1>Каталог</h1></section><div class="chips" id="chips"><button class="active">Все</button></div><section id="products" class="product-grid"></section></main><div class="modal" id="authModal"><div class="modal-card"><button class="close" id="closeAuth">×</button><h2>Вход в AutoStyle</h2><div class="tabs"><button class="active" data-tab="login">Вход</button><button data-tab="register">Регистрация</button></div><form id="loginForm" class="auth-form active"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Пароль" required><button>Войти</button></form><form id="registerForm" class="auth-form"><input id="regName" placeholder="Имя" required><input id="regEmail" type="email" placeholder="Email" required><input id="regPassword" type="password" minlength="6" placeholder="Пароль" required><button>Создать аккаунт</button></form><p id="msg" class="msg"></p></div></div><script type="module" src="js/app.js"></script><script type="module" src="js/auth-modal.js"></script></body></html>

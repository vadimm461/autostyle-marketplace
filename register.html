<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — AutoStyle</title><link rel="stylesheet" href="css/style.css"><script type="module" src="js/auth.js"></script></head><body><div class="authwrap"><form id="registerForm" class="authbox"><a class="logo" href="index.html"><span class="mark">AS</span><span>AUTO<span class="grad">STYLE</span></span></a><h1>Регистрация</h1><p class="muted">После регистрации ты попадёшь на главную, не в админку.</p><div id="msg" class="notice"></div><div class="field"><label>Имя</label><input class="input" name="name" required></div><div class="field"><label>Email</label><input class="input" name="email" type="email" required></div><div class="field"><label>Пароль</label><input class="input" name="password" type="password" minlength="6" required></div><button class="btn primary" style="width:100%;justify-content:center">Создать аккаунт</button><p class="muted">Уже есть аккаунт? <a class="grad" href="login.html">Войти</a></p></form></div></body></html>

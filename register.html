<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — AutoStyle</title>
<link rel="icon" type="image/png" href="assets/as-logo-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modern-ready.css">
<link rel="stylesheet" href="css/page-loader.css">
<link rel="stylesheet" href="css/auth-upgrade.css">
<link rel="stylesheet" href="css/autostyle-project-rework.css?v=20260608-rework2">
<link rel="stylesheet" href="css/final-request-clean-fix.css?v=20260608-final-request">
<link rel="stylesheet" href="css/as-logo-final.css?v=20260608-brand-final">
<link rel="stylesheet" href="css/auth-email-only-fix.css?v=20260615-email-only">
<script src="js/mobile-redirect.js"></script>
<style>
  body{min-height:100vh;background:radial-gradient(circle at top left,rgba(57,255,20,.18),transparent 34%),#f5f7f8;color:#111827}
  .login-shell{max-width:1180px;margin:0 auto;padding:32px 18px 70px}
  .login-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;margin-top:32px}
  .login-card{background:rgba(255,255,255,.88);border:1px solid rgba(17,24,39,.08);border-radius:30px;box-shadow:0 24px 70px rgba(17,24,39,.12);padding:34px;backdrop-filter:blur(16px)}
  .login-card h1{font-size:clamp(34px,5vw,64px);line-height:.95;margin:0 0 18px;font-weight:950;letter-spacing:-.05em}
  .login-card p{font-size:18px;color:#56606b;max-width:620px;line-height:1.55}
  .login-panel{background:#111827;color:white;border-radius:30px;padding:28px;box-shadow:0 24px 70px rgba(17,24,39,.22)}
  .login-panel h2{margin:0 0 8px;font-size:28px}.login-panel .muted{color:#b8c0cc}
  .login-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.login-actions .primary,.login-actions .secondary{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:16px;font-weight:900}
  .email-only-note{margin-top:18px;padding:14px 16px;border-radius:18px;background:rgba(57,255,20,.12);color:#dcffe2;border:1px solid rgba(57,255,20,.2)}
  @media(max-width:820px){.login-hero{grid-template-columns:1fr}.login-card,.login-panel{padding:24px}}
</style>
</head>
<body>
<script src="js/page-loader.js"></script>
<header class="site-header">
  <div class="header-inner">
    <a class="logo as-logo-link" href="index.html" aria-label="AutoStyle — главная"><img class="as-logo-img" src="assets/autostyle-logo-header-clean@3x.png" srcset="assets/autostyle-logo-header-clean.png 1x, assets/autostyle-logo-header-clean@2x.png 2x, assets/autostyle-logo-header-clean@3x.png 3x" width="720" height="158" alt="AutoStyle" decoding="async"></a>
    <a class="catalog-btn" href="catalog.html" style="text-decoration:none">☰ Каталог</a>
    <form class="search" action="catalog.html"><input name="q" placeholder="Я ищу автотовары..."><button>Найти</button></form>
    <nav class="header-actions"><button class="icon-btn" id="authOpen" type="button">👤 <span id="authText">Войти</span></button><a class="icon-btn" href="favorites.html">♡ <span>Избранное</span></a><a class="cart-btn" href="cart.html">🛒<b>Корзина</b><em id="cartCount">0</em></a></nav>
  </div>
</header>
<main class="login-shell">
  <section class="login-hero">
    <div class="login-card">
      <h1>Регистрация AutoStyle</h1>
      <p>Создайте аккаунт по почте и паролю. Телефон больше не запрашивается.</p>
      <div class="login-actions"><button class="primary" id="openLoginPage" type="button">Войти</button><button class="secondary" id="openRegisterPage" type="button">Создать аккаунт</button></div>
    </div>
    <div class="login-panel">
      <h2>Аккаунт покупателя</h2>
      <p class="muted">После входа появятся уведомления, профиль, скидочная карта, заказы и меню аккаунта.</p>
      <div class="email-only-note">Если пользователь не вошёл, уведомления и пункты профиля скрыты.</div>
    </div>
  </section>
</main>
<div class="modal" id="authModal"></div>
<script type="module" src="js/auth.js"></script>
<script src="js/ui-ready.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>{document.getElementById('openRegisterPage')?.click();});</script>
</body>
</html>

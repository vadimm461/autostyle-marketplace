<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/modern-ready.css"><title>Регистрация</title><link rel="stylesheet" href="css/page-loader.css"><link rel="stylesheet" href="css/desktop-product-card-final.css"><script src="js/mobile-redirect.js"></script><link rel="stylesheet" href="css/auth-upgrade.css"><link rel="stylesheet" href="css/desktop-final-request-fixes.css?v=20260604-final2"><link rel="stylesheet" href="css/final-user-fixes-20260604.css?v=20260604-4"><link rel="stylesheet" href="css/final-ux-fix5.css?v=20260606">  <link rel="stylesheet" href="css/notifications.css">
<link rel="stylesheet" href="css/autostyle-project-rework.css?v=20260608-rework2">
<link rel="stylesheet" href="css/autostyle-mockup-redesign.css?v=20260608-mockup"></head><body><script src="js/page-loader.js"></script><header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html"><img src="assets/logo.jpeg" alt="AutoStyle"><span>AUTO<span>STYLE</span></span></a>
    <button class="catalog-btn" id="catalogToggle">☰ Каталог</button>
    <form class="search" id="searchForm"><input id="searchInput" placeholder="Я ищу автотовары..."><button>Найти</button></form>
    <nav class="header-actions">
      <button class="icon-btn" id="authOpen">👤 <span id="authText">Войти</span></button>
      
      <button class="icon-btn">♡ <span>Избранное</span></button>
      <button class="cart-btn" id="cartOpen">🛒<b>Корзина</b><em id="cartCount">0</em></button>
    </nav>
  </div>
</header>
<div class="modal" id="authModal">
  <div class="modal-card">
    <button class="modal-close" data-close="authModal">×</button>
    <div id="authGuest">
      <h2>Вход в AutoStyle</h2>
      <p class="muted">Войдите или создайте аккаунт прямо здесь.</p>
      <div class="tabs"><button class="tab active" data-tab="loginPane">Вход</button><button class="tab" data-tab="registerPane">Регистрация</button></div>
      <form id="modalLogin" class="pane active">
        <label>Email<input id="loginEmail" type="email" required></label>
        <label>Пароль<input id="loginPassword" type="password" required></label>
        <button class="primary">Войти</button>
      </form>
      <form id="modalRegister" class="pane">
        <label>Имя<input id="regName" required></label>
        <label>Email<input id="regEmail" type="email" required></label>
        <label>Пароль<input id="regPassword" type="password" minlength="6" required></label>
        <button class="primary">Создать аккаунт</button>
      </form>
    </div>
    <div id="authUser" class="hidden">
      <h2>Мой аккаунт</h2>
      <p class="user-email" id="userEmail"></p>
      <p class="muted">Вы авторизованы на сайте.</p>
      
      <button class="secondary" id="logoutBtn">Выйти</button>
    </div>
    <p id="authMsg" class="msg"></p>
  </div>
</div>
<div class="modal" id="cartModal"><div class="modal-card"><button class="modal-close" data-close="cartModal">×</button><h2>Корзина</h2><div id="cartItems" class="cart-list"></div><button class="primary">Оформить заказ</button></div></div><main class="page-card"><h1>Регистрация</h1><p>Вход теперь открывается во всплывающем окне.</p><button class="primary" id="openRegisterPage">Открыть регистрацию</button></main><script type="module" src="js/firebase.js"></script><script type="module" src="js/auth.js"></script><script>document.getElementById('openRegisterPage').onclick=()=>document.getElementById('authModal').classList.add('open')</script>  <script type="module" src="js/notifications.js"></script>
<script src="js/autostyle-project-rework.js?v=20260608-rework2" defer></script>
<script src="js/autostyle-mockup-redesign.js?v=20260608-mockup" defer></script></body></html>

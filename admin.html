<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin AutoStyle</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side">
    <a class="logo" href="index.html"><div class="logo-mark">AS</div>AUTO<span>STYLE</span></a>

    <nav class="admin-nav">
      <button class="active" data-section="dashboard">Главная</button>
      <button data-section="products">Товары</button>
      <button data-section="categories">Категории</button>
      <button data-section="banners">Баннеры</button>
      <a href="index.html" class="admin-link-btn">На сайт</a>
    </nav>
  </aside>

  <main class="admin-main">
    <button id="logout" class="icon-btn" style="float:right">Выйти</button>

    <h1>Панель управления</h1>
    <p class="muted">Полное управление контентом сайта AutoStyle.</p>

    <section id="dashboard" class="admin-section active">
      <div class="admin-grid">
        <div class="admin-card"><h2>Товары</h2><p class="muted">Добавление, редактирование и фото.</p></div>
        <div class="admin-card"><h2>Категории</h2><p class="muted">Дерево категорий и подкатегорий.</p></div>
      </div>
    </section>

    <section id="products" class="admin-section">
      <div class="admin-card">
        <h2>Товар</h2>

        <form id="productForm" class="grid2">

          <label class="field">
            Название
            <input id="pTitle" required>
          </label>

          <label class="field">
            Цена
            <input id="pPrice" type="number" required>
          </label>

          <label class="field">
            Категория
            <select id="pCategory">
              <option value="">Выберите категорию</option>
            </select>
          </label>

          <label class="field">
            Метка товара
            <select id="pTag">
              <option value="hot">Горячие предложения</option>
              <option value="new">Новинки</option>
              <option value="best">Лучшая цена</option>
            </select>
          </label>

          <label class="field" style="grid-column:1/-1">
            Фото URL
            <input id="pImage">
          </label>

          <label class="field" style="grid-column:1/-1">
            Загрузить фото
            <input id="pFile" type="file" accept="image/*">
          </label>

          <div id="pUploadStatus" class="upload-box" style="grid-column:1/-1"></div>

          <label class="field" style="grid-column:1/-1">
            Описание
            <textarea id="pDesc"></textarea>
          </label>

          <button class="primary">Сохранить товар</button>

        </form>

        <div class="admin-tools">
          <input id="productSearch" placeholder="Поиск товара...">

          <select id="productCategoryFilter">
            <option value="">Все категории</option>
          </select>

          <select id="productTagFilter">
            <option value="">Все метки</option>
            <option value="hot">Горячие</option>
            <option value="new">Новинки</option>
            <option value="best">Лучшая цена</option>
          </select>
        </div>

        <div id="productList" class="list"></div>
      </div>
    </section>

    <section id="categories" class="admin-section">
      <div class="admin-card">
        <h2>Категории / подкатегории</h2>

        <form id="catForm" class="grid2">

          <label class="field">
            Название
            <input id="cTitle" required>
          </label>

          <label class="field">
            Иконка / код
            <input id="cIcon">
          </label>

          <label class="field">
            Порядковый номер
            <input id="cOrder" type="number" placeholder="10">
          </label>

          <label class="field">
            Родительская категория
            <select id="cParent">
              <option value="">Нет — основная категория</option>
            </select>
          </label>

          <button class="primary">Сохранить категорию</button>

        </form>

        <div class="admin-tools">
          <input id="catSearch" placeholder="Поиск категории...">

          <select id="catParentFilter">
            <option value="">Все категории</option>
            <option value="root">Только основные</option>
          </select>
        </div>

        <div id="catList" class="tree-list"></div>
      </div>
    </section>

    <section id="banners" class="admin-section">
      <div class="admin-card">
        <h2>Баннер</h2>

        <form id="bannerForm" class="grid2">
          <label class="field">Заголовок<input id="bTitle" required></label>
          <label class="field">Ссылка<input id="bLink"></label>

          <label class="field" style="grid-column:1/-1">
            Фото URL
            <input id="bImage">
          </label>

          <label class="field" style="grid-column:1/-1">
            Загрузить фото
            <input id="bFile" type="file" accept="image/*">
          </label>

          <div id="bUploadStatus" class="upload-box" style="grid-column:1/-1"></div>

          <label class="field" style="grid-column:1/-1">
            Текст
            <textarea id="bText"></textarea>
          </label>

          <button class="primary">Сохранить баннер</button>
        </form>

        <div id="bannerList" class="list"></div>
      </div>
    </section>

  </main>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>

<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка AutoStyle</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="assets/logo.jpeg"><span>AUTO<span class="green">STYLE</span></span></a><a class="catalogBtn" href="index.html">Смотреть сайт</a><button id="logout" class="btn btnGhost">Выйти</button></div></header><main class="adminWrap"><div class="sectionHead"><h2>Управление сайтом</h2><span>Все блоки главной страницы редактируются здесь</span></div><section class="adminGrid"><aside class="adminMenu"><button data-tab="settings">Главная / тексты</button><button data-tab="categories">Категории</button><button data-tab="banners">Баннеры</button><button data-tab="products">Товары</button><button data-tab="features">Преимущества</button></aside><div>
<section id="settings" class="adminPanel"><h2>Главная страница</h2><form id="settingsForm"><label>Логотип текст / бренд</label><input id="set_brand" name="brand" placeholder='AUTO&lt;span class="green"&gt;STYLE&lt;/span&gt;'><div class="row"><input id="set_phone" name="phone" placeholder="Телефон"><input id="set_slogan" name="slogan" placeholder="Верхний слоган"></div><input id="set_heroTitle" name="heroTitle" placeholder="Заголовок баннера"><textarea id="set_heroText" name="heroText" placeholder="Текст баннера"></textarea><input id="set_heroImage" name="heroImage" placeholder="Ссылка на фото баннера"><input name="heroFile" type="file"><button class="btn btnPrimary">Сохранить главную</button></form></section>
<section id="categories" class="adminPanel hidden"><h2>Категории</h2><form id="catForm" class="row"><input name="title" placeholder="Название категории" required><input name="icon" placeholder="Иконка, например 🛢️"><button class="btn btnPrimary">Добавить</button></form><div id="catList"></div></section>
<section id="banners" class="adminPanel hidden"><h2>Баннеры</h2><form id="bannerForm"><div class="row"><input name="title" placeholder="Заголовок" required><select name="type"><option value="green">Зеленый</option><option value="dark">Темный</option></select></div><textarea name="text" placeholder="Описание"></textarea><input name="link" placeholder="Ссылка, например catalog.html"><input name="imageUrl" placeholder="Ссылка на картинку"><input name="file" type="file"><button class="btn btnPrimary">Добавить баннер</button></form><div id="bannerList"></div></section>
<section id="products" class="adminPanel hidden"><h2>Товары</h2><form id="productForm"><div class="row"><input name="title" placeholder="Название" required><input name="category" placeholder="Категория"></div><div class="row"><input name="price" type="number" placeholder="Цена" required><input name="oldPrice" type="number" placeholder="Старая цена"></div><textarea name="description" placeholder="Описание"></textarea><input name="imageUrl" placeholder="Ссылка на фото"><input name="file" type="file"><label><input name="inStock" type="checkbox" checked style="width:auto"> В наличии</label><button class="btn btnPrimary">Добавить товар</button></form><div id="productList"></div></section>
<section id="features" class="adminPanel hidden"><h2>Преимущества</h2><form id="featureForm"><input name="title" placeholder="Заголовок" required><textarea name="text" placeholder="Текст"></textarea><button class="btn btnPrimary">Добавить блок</button></form><div id="featureList"></div></section>
</div></section></main><script type="module" src="js/admin.js"></script></body></html>

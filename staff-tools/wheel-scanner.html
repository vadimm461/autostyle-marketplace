<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка приза — AutoStyle</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/modern-ready.css"><link rel="stylesheet" href="../css/shop-pages.css"><link rel="stylesheet" href="../css/header-icons-site-colors.css"><link rel="stylesheet" href="../css/as-logo-final.css"><link rel="stylesheet" href="../css/wheel-fortune.css"><script type="module" src="access-guard.js"></script></head>
<body style="min-height:100vh;display:flex;flex-direction:column;background:#f4f7fb">
<header class="topbar dark-topbar"><div class="bar"><a class="logo as-logo-link" href="../index.html"><img class="as-logo-img" src="../assets/autostyle-logo-header-clean@3x.png" alt="AutoStyle"></a><a class="catalog-btn" href="../catalog.html">☰ Каталог</a><form class="search"><input placeholder="Я ищу автотовары..."><button type="button">Найти</button></form><a class="icon-btn as-head-icon-btn" href="../profile.html"><span class="as-head-icon"><img src="../assets/icons/user.svg"></span><span class="as-head-label">Аккаунт</span></a></div></header>
<main style="flex:1"><section class="wheel-scan-box"><h1>Проверка выигрыша</h1><p class="muted">Сканируй штрихкод сканером или введи код вручную.</p><input id="scanInput" class="wheel-scan-input" autofocus placeholder="ASW..."><div id="scanResult" class="wheel-scan-result"></div></section></main>
<footer class="footer"><div class="footer-copy"><span>© 2026 AutoStyle</span><span>Dev by d.vadim.v</span></div></footer>
<script type="module">
import {db} from '../js/firebase.js';import {collection,query,where,getDocs,limit,doc,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const input=document.getElementById('scanInput'),result=document.getElementById('scanResult');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
async function lookup(){const code=input.value.trim();if(!code)return;result.innerHTML='Проверка...';const snap=await getDocs(query(collection(db,'autostyle_wheel_prizes'),where('barcode','==',code),limit(1)));if(snap.empty){result.innerHTML='<div class="profile-msg error">Штрихкод не найден.</div>';return}const d=snap.docs[0],p=d.data(),exp=p.expiresAt?.toDate?.(),expired=exp&&exp<Date.now(),redeemed=p.status==='redeemed';result.innerHTML=`<article class="wheel-prize-card"><img src="${esc(p.productImage||'../assets/as-logo-192.png')}"><div><h2>${esc(p.productName)}</h2><p>Email: ${esc(p.userEmail||'—')}</p><p>Код товара: ${esc(p.productCode||'—')}</p><p>Забрать до: ${exp?exp.toLocaleString('ru-RU'):'—'}</p><p><b>${redeemed?'УЖЕ ВЫДАН':expired?'СРОК ИСТЁК':'МОЖНО ВЫДАТЬ'}</b></p></div>${!redeemed&&!expired?'<button id="redeemBtn" class="wheel-spin-btn" type="button">Подтвердить выдачу</button>':''}</article>`;document.getElementById('redeemBtn')?.addEventListener('click',async()=>{await updateDoc(doc(db,'autostyle_wheel_prizes',d.id),{status:'redeemed',redeemedAt:serverTimestamp()});lookup()})}
input.addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});input.addEventListener('change',lookup);
</script></body></html>

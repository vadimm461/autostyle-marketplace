<script type="module">
import { initializeApp, getApps, getApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const config={
  apiKey:"AIzaSyBZ-AW6XoMR14KmBtlz2q06Z0jPGXnWMTw",
  authDomain:"auto-style-4dbb7.firebaseapp.com",
  projectId:"auto-style-4dbb7",
  storageBucket:"auto-style-4dbb7.firebasestorage.app",
  messagingSenderId:"217023127803",
  appId:"1:217023127803:web:78568cf161edd452b0905e"
};
const app=getApps().length?getApp():initializeApp(config);
const db=getFirestore(app);

const fallback=[
  {title:"КАЛЬКУЛЯТОР РАССРОЧКИ",bank:"АГРОПРОМБАНК",rows:[["3 мес.",0.955],["6 мес.",0.93],["9 мес.",0.90],["12 мес.",0.875]]},
  {title:"КАЛЬКУЛЯТОР РАССРОЧКИ",bank:"ЭКСИМБАНК",rows:[["3 мес.",0.955],["6 мес.",0.93],["9 мес.",0.90],["12 мес.",0.886]]},
  {title:"КАЛЬКУЛЯТОР РАССРОЧКИ",bank:"СБЕРБАНК",rows:[["3 мес.",0.96],["6 мес.",0.93],["9 мес.",0.90],["12 мес.",0.88]]}
];

function rows(value){
  return (value||[]).map(row=>Array.isArray(row)?[row[0],Number(row[1])]:[row.term||row.title||"",Number(row.coef??row.value??0)]).filter(row=>row[0]&&!Number.isNaN(row[1]));
}
function escapeHtml(value){
  return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function render(calculators){
  calculatorGrid.innerHTML=(calculators||fallback).map((calc,index)=>`
    <article class="calculator-card" data-index="${index}">
      <div class="calculator-title">${escapeHtml(calc.title||"КАЛЬКУЛЯТОР РАССРОЧКИ")}</div>
      <div class="calculator-bank">${escapeHtml(calc.bank||"БАНК")}</div>
      <input class="calculator-input" type="number" min="0" step="0.01" placeholder="Введите сумму товара">
      <button class="calculator-button" type="button">РАССЧИТАТЬ</button>
      <table class="calculator-table">
        <tbody>${rows(calc.rows).map(([term,coef])=>`
          <tr><td>${escapeHtml(term)}</td><td>${coef}</td><td class="result">—</td></tr>
        `).join("")}</tbody>
      </table>
    </article>
  `).join("");

  document.querySelectorAll(".calculator-card").forEach(card=>{
    card.querySelector(".calculator-button").addEventListener("click",()=>{
      const sum=Number(card.querySelector(".calculator-input").value);
      if(!Number.isFinite(sum)||sum<=0){card.querySelector(".calculator-input").focus();return;}
      card.querySelectorAll("tr").forEach(row=>{
        const coef=Number(row.children[1].textContent);
        row.querySelector(".result").textContent=(sum/coef).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₽";
      });
    });
  });
}
try{
  const snap=await getDoc(doc(db,"site","main"));
  render(snap.exists()&&Array.isArray(snap.data().calculators)?snap.data().calculators:fallback);
}catch(error){
  console.warn("Используются стандартные коэффициенты:",error);
  render(fallback);
}
</script>

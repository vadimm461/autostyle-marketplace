<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Inter,sans-serif;
background:#f4f7fb;
overflow-x:hidden;
color:#111827;
}

/* LEGACY HEADER (не используется) */

.header{
height:82px;
background:rgba(255,255,255,.88);
backdrop-filter:blur(14px);
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:sticky;
top:0;
z-index:999;
}

.left{
display:flex;
align-items:center;
gap:16px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:#111827;
}

.logo img{
width:44px;
height:44px;
border-radius:10px;
}

.logo-title{
font-size:28px;
font-weight:900;
}

.green{
color:#22c55e;
}

.subtitle{
font-size:11px;
letter-spacing:2px;
color:#94a3b8;
}

.back{
border:none;
background:linear-gradient(135deg,#34c759,#15803d);
color:white;
padding:12px 20px;
border-radius:16px;
cursor:pointer;
font-weight:800;
}

/* CONTENT */

.content{
width:min(1480px,calc(100% - 32px));
margin:28px auto 40px;
padding:0;
}

/* Подгонка фото как в основном каталоге */
.product-photo{
position:relative;
background:#fff !important;
isolation:isolate;
}

.product-photo::before{
content:"";
position:absolute;
inset:0;
background-image:var(--as-product-bg);
background-size:cover;
background-position:center;
filter:blur(22px);
opacity:.08;
transform:scale(1.12);
z-index:-1;
}

.product-photo img{
display:block;
width:100%;
height:100%;
object-fit:contain !important;
object-position:center !important;
background:#fff;
padding:10px;
}

/* TOTAL */

.total{
background:
linear-gradient(
135deg,
#111827,
#0f172a,
#020617
);

border-radius:32px;
padding:28px;
margin-bottom:28px;

box-shadow:
0 20px 40px rgba(0,0,0,.15);

color:white;
}

.total-title{
font-size:18px;
opacity:.7;
margin-bottom:6px;
}

.total-value{
font-size:52px;
font-weight:900;
line-height:1;
}

.total-sub{
margin-top:14px;
font-size:15px;
opacity:.65;
}

/* GROUP */

.group-block{
margin-bottom:24px;
}

.group-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
padding:18px 24px;
background:white;
border-radius:24px;
cursor:pointer;
box-shadow:0 10px 20px rgba(0,0,0,.05);
}

.group-title{
font-size:32px;
font-weight:900;
}

.toggle-btn{
background:linear-gradient(135deg,#22c55e,#15803d);
color:white;
padding:10px 18px;
border-radius:14px;
font-size:14px;
font-weight:800;
}

/* GRID */

.products-grid{
display:none;
grid-template-columns:repeat(auto-fill,minmax(230px,260px));
gap:14px;
align-items:stretch;
}

.products-grid.active{
display:grid;
}

.card{
display:flex;
flex-direction:column;
min-height:355px;
padding:12px;
border:1px solid #e8edf3;
border-radius:18px;
background:#fff;
box-shadow:0 8px 22px rgba(15,23,42,.07);
overflow:hidden;
transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.card:hover{
transform:translateY(-2px);
border-color:rgba(37,211,31,.34);
box-shadow:0 14px 30px rgba(15,23,42,.11);
}

.product-photo{
width:100%;
height:170px;
flex:0 0 170px;
border-radius:14px;
background:#f7f9fb;
display:grid;
place-items:center;
overflow:hidden;
margin-bottom:10px;
}

.product-photo img{
width:100%;
height:100%;
object-fit:contain;
padding:8px;
}

.product-photo-empty{
font-size:13px;
font-weight:800;
color:#94a3b8;
text-align:center;
padding:10px;
}

.card h2{
display:-webkit-box;
-webkit-box-orient:vertical;
-webkit-line-clamp:3;
overflow:hidden;
min-height:58px;
margin:0 0 9px;
font-size:16px;
line-height:1.2;
font-weight:900;
color:#111827;
word-break:break-word;
}

.stats{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:5px;
margin-bottom:9px;
font-size:10px;
color:#64748b;
}

.stats span{
background:#f8fafc;
border-radius:9px;
padding:6px 5px;
min-width:0;
overflow:hidden;
text-overflow:ellipsis;
}

.stats b{
display:block;
color:#111827;
font-size:12px;
margin-top:2px;
overflow:hidden;
text-overflow:ellipsis;
}

.card-bottom{
margin-top:auto;
}

.bonus-top{
margin:0 0 7px;
font-size:13px;
font-weight:900;
color:#16a34a;
}

.progress{
height:9px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin:0 0 8px;
}

.progress-bar{
height:100%;
border-radius:999px;
font-size:0;
transition:.4s;
}

.money{
padding:8px 10px;
border-radius:11px;
background:#f0fdf4;
border:1px solid #d1fae5;
}

.money-label{
font-size:10px;
color:#64748b;
margin-bottom:2px;
font-weight:700;
}

.money-value{
font-size:17px;
font-weight:900;
color:#15803d;
line-height:1.1;
}

/* MOBILE */

@media(max-width:900px){
.products-grid{
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
}
}

@media(max-width:600px){

.header{
padding:12px;
height:auto;
flex-wrap:wrap;
gap:12px;
}

.logo-title{
font-size:22px;
}

.content{
padding:12px;
}

.products-grid{
grid-template-columns:1fr;
gap:12px;
}

.group-title{
font-size:24px;
}

.total{
padding:22px;
border-radius:24px;
}

.total-value{
font-size:38px;
}

.card{
min-height:335px;
padding:10px;
border-radius:16px;
}

.product-photo{
height:155px;
flex-basis:155px;
}

.money-value{
font-size:15px;
}

.group-header{
padding:16px;
}

}

</style>

<script type="module">

import { initializeApp, getApps, getApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
onSnapshot,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBZ-AW6XoMR14KmBtlz2q06Z0jPGXnWMTw",
authDomain: "auto-style-4dbb7.firebaseapp.com",
projectId: "auto-style-4dbb7",
storageBucket: "auto-style-4dbb7.firebasestorage.app",
messagingSenderId: "217023127803",
appId: "1:217023127803:web:78568cf161edd452b0905e"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);

const db = getFirestore(app);

const container =
document.getElementById('products');

const totalEl =
document.getElementById('totalBonus');

function normalizeGroup(value){
const group = String(value || "").trim();
return group || "Без группы";
}

let catalogById = new Map();
let catalogByCode = new Map();

function normalizeCode(value){
return String(value || "").trim().toLowerCase();
}

function catalogName(product){
return String(
product.name ||
product.title ||
product.productName ||
""
).trim();
}

function catalogImage(product){
return String(
product.image ||
product.imageURL ||
product.imageUrl ||
product.photo ||
""
).trim();
}

async function loadCatalogIndex(){
try{
const snapshot = await getDocs(collection(db,"autostyle_products"));

snapshot.forEach((docSnap)=>{
const data = docSnap.data();
const item = { id:docSnap.id, ...data };

catalogById.set(docSnap.id,item);

const code = normalizeCode(
data.code ||
data.productCode ||
data.article ||
data.sku
);

if(code){
catalogByCode.set(code,item);
}
});
}catch(error){
console.error("Не удалось загрузить каталог товаров:",error);
}
}

function enrichProduct(product){
const catalogProduct =
catalogById.get(String(product.sourceProductId || "")) ||
catalogByCode.get(normalizeCode(product.code)) ||
null;

if(!catalogProduct){
return product;
}

return {
...product,
name: catalogName(catalogProduct) || product.name,
image: catalogImage(catalogProduct) || product.image,
group: catalogProduct.group || catalogProduct.parent || catalogProduct.category || product.group,
code: catalogProduct.code || catalogProduct.productCode || catalogProduct.article || catalogProduct.sku || product.code
};
}

function safe(v){

return isNaN(Number(v))
? 0
: Number(v);

}

function toggleGroup(id){

const grid =
document.getElementById(id);

grid.classList.toggle('active');

}

window.toggleGroup =
toggleGroup;

function renderProducts(products){

container.innerHTML = '';

let total = 5000;
let maxTotal = 5000;

if(products.length === 0){
container.innerHTML = `
<div style="background:white;border-radius:24px;padding:28px;text-align:center;color:#64748b">
Товары для расчёта премии пока не добавлены.
</div>`;
totalEl.innerText = "5000 ₽";
return;
}

const groups = [...new Set(
products.map(product => normalizeGroup(product.group))
)].sort((a,b) => a.localeCompare(b, "ru"));

groups.forEach((group,index)=>{

const groupProducts =
products.filter(
p => normalizeGroup(p.group) === group
);

if(groupProducts.length === 0){
return;
}

const block =
document.createElement('div');

block.className =
'group-block';

const groupId =
'group_' + index;

block.innerHTML = `

<div
class="group-header"
onclick="toggleGroup('${groupId}')">

<div class="group-title">
${group}
</div>

<div class="toggle-btn">
Развернуть
</div>

</div>

<div
class="products-grid"
id="${groupId}">

</div>

`;

container.appendChild(block);

const grid =
document.getElementById(groupId);

groupProducts.forEach(product=>{

const sold =
safe(product.sold);

const plan =
safe(product.plan);

const bonusPer =
safe(product.bonus);

const bonus =
sold * bonusPer;

const maxBonus =
plan * bonusPer;

const percent =
plan > 0
? Math.min((sold/plan)*100,100)
: 0;

total += bonus;
maxTotal += maxBonus;

let color = `
linear-gradient(
90deg,
#ef4444,
#dc2626
)
`;

if(percent >= 40){

color = `
linear-gradient(
90deg,
#f59e0b,
#d97706
)
`;

}

if(percent >= 70){

color = `
linear-gradient(
90deg,
#22c55e,
#15803d
)
`;

}

const card =
document.createElement('div');

card.className =
'card';

card.innerHTML = `

<div class="product-photo">
${product.image
? `<img src="${product.image}" alt="${product.name || ''}" loading="lazy">`
: `<div class="product-photo-empty">Нет фото</div>`}
</div>

<h2 title="${product.name || "Без названия"}">${product.name || "Без названия"}</h2>

<div class="stats">
<span>Продано:<b>${sold}</b></span>
<span>Код:<b>${product.code || "-"}</b></span>
<span>План:<b>${plan}</b></span>
</div>

<div class="card-bottom">
<div class="bonus-top">Начислено: ${bonus} ₽</div>

<div class="progress">
<div class="progress-bar" style="width:${percent}%;background:${color};"></div>
</div>

<div class="money">
<div class="money-label">Премия за товар</div>
<div class="money-value">${bonus} ₽ / ${maxBonus} ₽</div>
</div>
</div>

`;

grid.appendChild(card);

});

});

totalEl.innerText =
`${total} / ${maxTotal} ₽`;

}

await loadCatalogIndex();

onSnapshot(

collection(db,"products"),

(snapshot)=>{

const products = [];

snapshot.forEach((doc)=>{

products.push(enrichProduct(doc.data()));

});

renderProducts(products);

}

);

</script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Inter,sans-serif;
background:#f4f7fb;
overflow-x:hidden;
color:#111827;
}

/* LEGACY HEADER (не используется) */

.header{
height:82px;
background:rgba(255,255,255,.88);
backdrop-filter:blur(14px);
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:sticky;
top:0;
z-index:999;
}

.left{
display:flex;
align-items:center;
gap:16px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:#111827;
}

.logo img{
width:44px;
height:44px;
border-radius:10px;
}

.logo-title{
font-size:28px;
font-weight:900;
}

.green{
color:#22c55e;
}

.subtitle{
font-size:11px;
letter-spacing:2px;
color:#94a3b8;
}

.back{
border:none;
background:linear-gradient(135deg,#34c759,#15803d);
color:white;
padding:12px 20px;
border-radius:16px;
cursor:pointer;
font-weight:800;
}

/* CONTENT */

.content{
width:min(1480px,calc(100% - 32px));
margin:28px auto 40px;
padding:0;
}

/* Подгонка фото как в основном каталоге */
.product-photo{
position:relative;
background:#fff !important;
isolation:isolate;
}

.product-photo::before{
content:"";
position:absolute;
inset:0;
background-image:var(--as-product-bg);
background-size:cover;
background-position:center;
filter:blur(22px);
opacity:.08;
transform:scale(1.12);
z-index:-1;
}

.product-photo img{
display:block;
width:100%;
height:100%;
object-fit:contain !important;
object-position:center !important;
background:#fff;
padding:10px;
}

/* TOTAL */

.total{
background:
linear-gradient(
135deg,
#111827,
#0f172a,
#020617
);

border-radius:32px;
padding:28px;
margin-bottom:28px;

box-shadow:
0 20px 40px rgba(0,0,0,.15);

color:white;
}

.total-title{
font-size:18px;
opacity:.7;
margin-bottom:6px;
}

.total-value{
font-size:52px;
font-weight:900;
line-height:1;
}

.total-sub{
margin-top:14px;
font-size:15px;
opacity:.65;
}

/* GROUP */

.group-block{
margin-bottom:24px;
}

.group-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
padding:18px 24px;
background:white;
border-radius:24px;

box-shadow:0 10px 20px rgba(0,0,0,.05);
}

.group-title{
font-size:32px;
font-weight:900;
}

.toggle-btn{
background:linear-gradient(135deg,#22c55e,#15803d);
color:white;
padding:10px 18px;
border-radius:14px;
font-size:14px;
font-weight:800;
}

/* GRID */

.products-grid{
display:none;
grid-template-columns:repeat(auto-fill,minmax(230px,260px));
gap:14px;
align-items:stretch;
}

.products-grid.active{
display:grid;
}

.card{

flex-direction:column;

padding:12px;

border-radius:18px;

.card:hover{

height:170px;

.product-photo img{

height:100%;

.card h2{

.stats{

.card-bottom{

<script type="module">

import { initializeApp, getApps, getApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
onSnapshot,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBZ-AW6XoMR14KmBtlz2q06Z0jPGXnWMTw",
authDomain: "auto-style-4dbb7.firebaseapp.com",
projectId: "auto-style-4dbb7",
storageBucket: "auto-style-4dbb7.firebasestorage.app",
messagingSenderId: "217023127803",
appId: "1:217023127803:web:78568cf161edd452b0905e"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);

const db = getFirestore(app);

const container =
document.getElementById('products');

const totalEl =
document.getElementById('totalBonus');

function normalizeGroup(value){
const group = String(value || "").trim();
return group || "Без группы";
}

let catalogById = new Map();
let catalogByCode = new Map();

function normalizeCode(value){
return String(value || "").trim().toLowerCase();
}

function catalogName(product){
return String(
product.name ||
product.title ||
product.productName ||
""
).trim();
}

function catalogImage(product){
return String(
product.image ||
product.imageURL ||
product.imageUrl ||
product.photo ||
""
).trim();
}

async function loadCatalogIndex(){
try{
const snapshot = await getDocs(collection(db,"autostyle_products"));

snapshot.forEach((docSnap)=>{
const data = docSnap.data();
const item = { id:docSnap.id, ...data };

catalogById.set(docSnap.id,item);

const code = normalizeCode(
data.code ||
data.productCode ||
data.article ||
data.sku
);

if(code){
catalogByCode.set(code,item);
}
});
}catch(error){
console.error("Не удалось загрузить каталог товаров:",error);
}
}

function enrichProduct(product){
const catalogProduct =
catalogById.get(String(product.sourceProductId || "")) ||
catalogByCode.get(normalizeCode(product.code)) ||
null;

if(!catalogProduct){
return product;
}

return {
...product,
name: catalogName(catalogProduct) || product.name,
image: catalogImage(catalogProduct) || product.image,
group: catalogProduct.group || catalogProduct.parent || catalogProduct.category || product.group,
code: catalogProduct.code || catalogProduct.productCode || catalogProduct.article || catalogProduct.sku || product.code
};
}

function safe(v){

return isNaN(Number(v))
? 0
: Number(v);

}

function toggleGroup(id){

const grid =
document.getElementById(id);

grid.classList.toggle('active');

}

window.toggleGroup =
toggleGroup;

function renderProducts(products){

container.innerHTML = '';

let total = 5000;
let maxTotal = 5000;

if(products.length === 0){
container.innerHTML = `
<div style="background:white;border-radius:24px;padding:28px;text-align:center;color:#64748b">
Товары для расчёта премии пока не добавлены.
</div>`;
totalEl.innerText = "5000 ₽";
return;
}

const groups = [...new Set(
products.map(product => normalizeGroup(product.group))
)].sort((a,b) => a.localeCompare(b, "ru"));

groups.forEach((group,index)=>{

const groupProducts =
products.filter(
p => normalizeGroup(p.group) === group
);

if(groupProducts.length === 0){
return;
}

const block =
document.createElement('div');

block.className =
'group-block';

const groupId =
'group_' + index;

block.innerHTML = `

<div
class="group-header"
onclick="toggleGroup('${groupId}')">

<div class="group-title">
${group}
</div>

<div class="toggle-btn">
Развернуть
</div>

</div>

<div
class="products-grid"
id="${groupId}">

</div>

`;

container.appendChild(block);

const grid =
document.getElementById(groupId);

groupProducts.forEach(product=>{

const sold =
safe(product.sold);

const plan =
safe(product.plan);

const bonusPer =
safe(product.bonus);

const bonus =
sold * bonusPer;

const maxBonus =
plan * bonusPer;

const percent =
plan > 0
? Math.min((sold/plan)*100,100)
: 0;

total += bonus;
maxTotal += maxBonus;

/*
Плавный цвет шкалы:
0%   — красный
50%  — жёлтый
100% — зелёный
*/
const hue = Math.round((percent / 100) * 120);
const hueEnd = Math.min(120, hue + 10);

const color = `
linear-gradient(
90deg,
hsl(${hue} 82% 50%),
hsl(${hueEnd} 76% 40%)
)
`;

const card =
document.createElement('div');

card.className =
'card';

card.innerHTML = `

<div class="product-photo">
${product.image
? `<img src="${product.image}" alt="${product.name || ''}" loading="lazy">`
: `<div class="product-photo-empty">Нет фото</div>`}
</div>

<h2 title="${product.name || "Без названия"}">${product.name || "Без названия"}</h2>

<div class="stats">
<span>Продано:<b>${sold}</b></span>
<span>Код:<b>${product.code || "-"}</b></span>
<span>План:<b>${plan}</b></span>
</div>

<div class="card-bottom">
<div class="bonus-top">Начислено: ${bonus} ₽</div>

<div class="progress">
<div class="progress-bar" style="width:${percent}%;background:${color};"></div>
</div>

<div class="money">
<div class="money-label">Премия за товар</div>
<div class="money-value">${bonus} ₽ / ${maxBonus} ₽</div>
</div>
</div>

`;

grid.appendChild(card);

});

});

totalEl.innerText =
`${total} / ${maxTotal} ₽`;

}

await loadCatalogIndex();

onSnapshot(

collection(db,"products"),

(snapshot)=>{

const products = [];

snapshot.forEach((doc)=>{

products.push(enrichProduct(doc.data()));

});

renderProducts(products);

}

);

</script>
